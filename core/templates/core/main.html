{% extends "base.html" %}
{% load static %}
{% block content %}

<section class="page-section" style="min-height:80vh;display:flex;align-items:center;">
  <div class="container text-center">

    <div class="terminal-window" style="max-width:700px;margin:0 auto;" data-aos="zoom-in" data-aos-delay="200">
      <div class="terminal-bar">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="terminal-label">main.py</span>
      </div>
      <div class="terminal-body" style="padding:40px 30px;">
        <div class="terminal-line"><span class="prompt">$</span><span class="cmd">python main.py</span></div>
        <div class="terminal-line output" style="padding-left:20px;font-size:1.5rem;font-weight:800;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-family:var(--font-display);line-height:1.5;">
          Welcome to Suyog's Portfolio
        </div>
        <div class="terminal-line output" style="padding-left:20px;margin-top:12px;">
          Django Developer &middot; Python Enthusiast &middot; Backend Architect
        </div>
        <div class="terminal-line" style="margin-top:24px;justify-content:center;gap:16px;flex-wrap:wrap;">
          <a href="{% url 'home' %}" class="btn-glow"><i class="bi bi-house"></i> Home</a>
          <a href="{% url 'project' %}" class="btn-ghost"><i class="bi bi-folder"></i> Projects</a>
          <a href="{% url 'contact' %}" class="btn-ghost"><i class="bi bi-envelope"></i> Contact</a>
        </div>
        <div class="terminal-line" style="margin-top:24px;"><span class="prompt">$</span><span style="color:var(--accent);animation:blink 1s step-end infinite;">_</span></div>
      </div>
    </div>

  </div>
</section>

<style>
@keyframes blink { 50%{opacity:0} }
@media (max-width: 480px) {
  .terminal-body { padding: 28px 16px !important; }
  .terminal-body .output { font-size: 1.2rem !important; }
}
</style>

{% endblock content %}
